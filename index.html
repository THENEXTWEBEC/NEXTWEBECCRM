<!doctype html
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>NextWebEC CRM</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; color: #101828; background: #f8fafc; }
      main { width: min(100% - 40px, 680px); padding: clamp(2.5rem, 8vw, 5.5rem); background: #fff; border: 1px solid #e4e7ec; border-radius: 24px; box-shadow: 0 20px 60px rgb(16 24 40 / 8%); }
      .mark { display: grid; place-items: center; width: 40px; height: 40px; margin-bottom: 28px; border-radius: 12px; color: #fff; background: #123a75; font-weight: 800; }
      p { max-width: 58ch; color: #475467; line-height: 1.7; }
      .tag { display: inline-block; margin-top: 1rem; padding: .42rem .75rem; color: #123a75; background: #eef4ff; border-radius: 999px; font-size: .85rem; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">N</div>
      <span class="tag">Implementación en curso</span>
      <h1>NextWebEC CRM</h1>
      <p>Base de datos, seguridad y control de acceso preparados. La interfaz privada estará disponible tras completar la siguiente fase de implementación.</p>
    </main>
  </body>
</html>
